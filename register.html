<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetix - Criar Conta | Talpa Systems</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --obsidian-pitch: #0B0E14;
      --charcoal-glass: rgba(22, 28, 38, 0.85);
      --border-slate: #263238;
      --talpa-lava: #FF5500;
      --cyber-cyan: #00E5FF;
      --electric-lime: #00E676;
      --telemetry-amber: #FFB300;
      
      --text-display: #F0F4F8;
      --text-section: #D0D8E0;
      --text-muted: #94A3B8;
      --text-log: #64748B;
      
      --dot-grid-color: #1C2432;
      
      --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--obsidian-pitch);
      background-image: radial-gradient(var(--dot-grid-color) 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      color: var(--text-display);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: var(--obsidian-pitch);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .auth-container {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }

    /* Logo Medium Aumentada */
    .logo-medium {
      width: 100px;
      height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 0 14px rgba(0, 229, 255, 0.45));
    }

    .brand-hero h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-display);
      letter-spacing: 0.8px;
    }

    .brand-hero p {
      font-size: 11px;
      color: var(--cyber-cyan);
      font-style: italic;
    }

    .form-glass {
      background: var(--charcoal-glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-slate);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-section);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
    }

    .form-input {
      width: 100%;
      background: rgba(11, 14, 20, 0.8);
      border: 1px solid var(--border-slate);
      border-radius: 8px;
      padding: 9px 12px 9px 36px;
      color: var(--text-display);
      font-family: var(--font-ui);
      font-size: 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }

    .btn-primary {
      background: var(--talpa-lava);
      border: 1px solid var(--talpa-lava);
      color: #FFF;
      padding: 11px;
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
      width: 100%;
      margin-top: 4px;
    }

    .btn-primary:hover {
      background: #E04B00;
    }

    .auth-footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .auth-footer a {
      color: var(--cyber-cyan);
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="auth-container">
      
      <div class="brand-hero">
        <img src="Imagens/logo sem fundo.webp" alt="Kinetix Talpa Systems Logo" class="logo-medium">
        <h1>KINETIX</h1>
        <p>"A inteligência que enxerga no escuro da carga."</p>
      </div>

      <form class="form-glass" id="registerForm" onsubmit="return handleRegister(event);">
        
        <div class="form-group">
          <label class="form-label" for="regName">Nome Completo</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="regName" class="form-input" placeholder="Seu nome completo" required value="Operador TransCargo">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">E-mail Corporativo</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="regEmail" class="form-input" placeholder="seuemail@transcargo.com.br" required value="operador@transcargo.com.br">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regCompany">Matrícula / Código de Operador</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            <input type="text" id="regCompany" class="form-input" placeholder="Ex: TC-8902" required value="TC-8902">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPass">Criar Senha</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="regPass" class="form-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required value="kinetix2026">
          </div>
        </div>

        <button type="submit" class="btn-primary">
          CRIAR CONTA & ACESSAR
        </button>

      </form>

      <div class="auth-footer">
        Já possui conta? <a href="login.html">Entrar</a>
      </div>

    </div>
  </div>

  <script>
    function handleRegister(event) {
      event.preventDefault();
      window.location.href = 'onboarding.html';
      return false;
    }
  </script>
</body>
</html>
