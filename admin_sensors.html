<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetix - Pareamento de Sensores | Admin</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --obsidian-pitch: #0B0E14;
      --charcoal-glass: rgba(22, 28, 38, 0.85);
      --border-slate: #263238;
      --talpa-lava: #FF5500;
      --cyber-cyan: #00E5FF;
      --electric-lime: #00E676;
      --telemetry-amber: #FFB300;
      
      --text-display: #F0F4F8;
      --text-section: #D0D8E0;
      --text-muted: #94A3B8;
      --text-log: #64748B;
      
      --dot-grid-color: #1C2432;
      
      --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--obsidian-pitch);
      background-image: radial-gradient(var(--dot-grid-color) 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      color: var(--text-display);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: var(--obsidian-pitch);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .app-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-slate);
      background: rgba(11, 14, 20, 0.95);
      backdrop-filter: blur(10px);
      z-index: 9;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
    }

    .brand-info h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-display);
      line-height: 1.1;
      letter-spacing: 0.5px;
    }

    .brand-info span {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .slogan-banner {
      background: rgba(22, 28, 38, 0.6);
      border-bottom: 1px solid var(--border-slate);
      padding: 6px 16px;
      font-size: 10px;
      color: var(--cyber-cyan);
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .screen-container {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 80px;
    }

    .screen-container::-webkit-scrollbar {
      width: 3px;
    }
    .screen-container::-webkit-scrollbar-thumb {
      background: var(--border-slate);
      border-radius: 4px;
    }

    .card-glass {
      background: var(--charcoal-glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      padding: 14px;
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .badge-lime {
      background: rgba(0, 230, 118, 0.12);
      color: var(--electric-lime);
      border: 1px solid rgba(0, 230, 118, 0.3);
    }

    .badge-cyan {
      background: rgba(0, 229, 255, 0.12);
      color: var(--cyber-cyan);
      border: 1px solid rgba(0, 229, 255, 0.3);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .form-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-section);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-select {
      width: 100%;
      background: rgba(11, 14, 20, 0.8);
      border: 1px solid var(--border-slate);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text-display);
      font-family: var(--font-mono);
      font-size: 11px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }

    .btn-primary {
      background: var(--talpa-lava);
      border: 1px solid var(--talpa-lava);
      color: #FFF;
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
      width: 100%;
      margin-top: 6px;
    }

    .btn-primary:hover {
      background: #E04B00;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      height: 64px;
      background: rgba(11, 14, 20, 0.95);
      border-top: 1px solid var(--border-slate);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
      width: 25%;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
    }

    .nav-item.active {
      color: var(--cyber-cyan);
      font-weight: 700;
    }

    .nav-item.active svg {
      stroke: var(--cyber-cyan);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="logo-icon" viewBox="0 0 100 100" fill="none">
          <polygon points="50,10 90,30 50,50 10,30" fill="none" stroke="#00E5FF" stroke-width="3"/>
          <polygon points="10,30 50,50 50,90 10,70" fill="none" stroke="#00E5FF" stroke-width="3"/>
          <polygon points="90,30 50,50 50,90 90,70" fill="none" stroke="#00E5FF" stroke-width="3"/>
          <line x1="50" y1="50" x2="80" y2="20" stroke="#FF5500" stroke-width="3" stroke-dasharray="2,2"/>
          <line x1="50" y1="50" x2="20" y2="80" stroke="#FF5500" stroke-width="3" stroke-dasharray="2,2"/>
          <line x1="50" y1="50" x2="50" y2="15" stroke="#FF5500" stroke-width="3"/>
        </svg>
        <div class="brand-info">
          <h1>KINETIX ADMIN</h1>
          <span>Cadastro de Sensores ESP32</span>
        </div>
      </div>
      <span class="card-badge badge-lime" id="adminBadge">Credencial Admin</span>
    </header>

    <div class="slogan-banner">
      "Módulo de Gerenciamento de Hardware Embarcado TransCargo Express"
    </div>

    <main class="screen-container">
      
      <!-- Card Cadastro do Sensor Principal Embarcado -->
      <form class="card-glass" onsubmit="return handleSensorSave(event)">
        <div class="card-header">
          <span class="card-title">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--cyber-cyan)" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            Pareamento de Hardware Embarcado
          </span>
          <span class="card-badge badge-cyan">BLE / MQTT</span>
        </div>

        <div class="form-group">
          <label class="form-label">ID do Dispositivo Embarcado</label>
          <input type="text" id="devId" class="form-input" value="ESP32-TK89-SJC" required>
        </div>

        <div class="form-group">
          <label class="form-label">Endereço MAC Bluetooth / WiFi</label>
          <input type="text" id="devMac" class="form-input" value="24:0A:C4:9E:81:B0" required>
        </div>

        <div class="form-group">
          <label class="form-label">Tópico MQTT Ingestão Wegnology</label>
          <input type="text" id="devTopic" class="form-input" value="kinetix/cargo/tc8902/telemetry" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div class="form-group">
            <label class="form-label">Acelerômetro 3D</label>
            <select class="form-select">
              <option selected>MPU6050 (0x68)</option>
              <option>MPU9250 (0x69)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Sensor Lacre Luz</label>
            <select class="form-select">
              <option selected>LDR ADC34 (Óptico)</option>
              <option>Fototransistor BPV10</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div class="form-group">
            <label class="form-label">Sensor Ambiência</label>
            <select class="form-select">
              <option selected>DHT22 / BME280</option>
              <option>SHT31 / BME680</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Satélite & RTC</label>
            <select class="form-select">
              <option selected>NEO-6M + DS1307</option>
            </select>
          </div>
        </div>

        <!-- Parâmetros Operacionais de Tolerância -->
        <div style="margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--border-slate);">
          <span style="font-size: 10px; color: var(--text-section); font-weight: 700; text-transform: uppercase;">Limites Operacionais de Tolerância</span>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px;">
            <div class="form-group">
              <label class="form-label">Impacto Max</label>
              <input type="text" class="form-input" value="1.5 G">
            </div>
            <div class="form-group">
              <label class="form-label">Temp Max</label>
              <input type="text" class="form-input" value="30.0 °C">
            </div>
            <div class="form-group">
              <label class="form-label">Luz Max</label>
              <input type="text" class="form-input" value="10 LUX">
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primary">
          SALVAR & PAREAR SENSOR EMBARCADO
        </button>
      </form>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="nav-bar">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Gêmeo 3D</span>
      </a>

      <a href="timeline.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
        <span>Auditoria</span>
      </a>

      <a href="qr_scanner.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M9 9h6v6H9z"/></svg>
        <span>QR Code</span>
      </a>

      <a href="admin_sensors.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Parear Sensores</span>
      </a>
    </nav>
  </div>

  <script>
    function handleSensorSave(e) {
      e.preventDefault();
      const id = document.getElementById('devId').value;
      alert(`Sensor Embarcado ${id} cadastrado e pareado com sucesso!\n\nTópicos MQTT ativados e sincronizados com a nuvem Wegnology.`);
      return false;
    }
  </script>
</body>
</html>
