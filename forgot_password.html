<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetix - Recuperar Senha | Talpa Systems</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --obsidian-pitch: #0B0E14;
      --charcoal-glass: rgba(22, 28, 38, 0.85);
      --border-slate: #263238;
      --talpa-lava: #FF5500;
      --cyber-cyan: #00E5FF;
      --electric-lime: #00E676;
      --telemetry-amber: #FFB300;
      
      --text-display: #F0F4F8;
      --text-section: #D0D8E0;
      --text-muted: #94A3B8;
      --text-log: #64748B;
      
      --dot-grid-color: #1C2432;
      
      --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--obsidian-pitch);
      background-image: radial-gradient(var(--dot-grid-color) 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      color: var(--text-display);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: var(--obsidian-pitch);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .auth-container {
      flex: 1;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .brand-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    /* Logo Large Aumentada */
    .logo-large {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(0, 229, 255, 0.45));
    }

    .brand-hero h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-display);
      letter-spacing: 1px;
    }

    .sub-hero {
      font-size: 11px;
      color: var(--text-muted);
      max-width: 300px;
      line-height: 1.4;
    }

    .form-glass {
      background: var(--charcoal-glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-slate);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-section);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
    }

    .form-input {
      width: 100%;
      background: rgba(11, 14, 20, 0.8);
      border: 1px solid var(--border-slate);
      border-radius: 8px;
      padding: 10px 12px 10px 36px;
      color: var(--text-display);
      font-family: var(--font-ui);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }

    .btn-primary {
      background: var(--talpa-lava);
      border: 1px solid var(--talpa-lava);
      color: #FFF;
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
      width: 100%;
    }

    .btn-primary:hover {
      background: #E04B00;
    }

    .auth-footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .auth-footer a {
      color: var(--cyber-cyan);
      font-weight: 700;
      text-decoration: none;
    }

    /* Kinetix Custom SweetAlert Style Modal */
    .sweet-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .sweet-backdrop.active {
      display: flex;
      animation: sweetPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes sweetPop {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .sweet-card {
      width: 100%;
      max-width: 340px;
      background: #111722;
      border: 1px solid var(--cyber-cyan);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
    }

    .sweet-icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 229, 255, 0.1);
      border: 2px solid var(--cyber-cyan);
      color: var(--cyber-cyan);
    }

    .sweet-icon-wrap.success {
      background: rgba(0, 230, 118, 0.1);
      border-color: var(--electric-lime);
      color: var(--electric-lime);
    }

    .sweet-icon-wrap.alert {
      background: rgba(255, 85, 0, 0.1);
      border-color: var(--talpa-lava);
      color: var(--talpa-lava);
    }

    .sweet-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-display);
    }

    .sweet-msg {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .sweet-btn {
      background: var(--cyber-cyan);
      border: none;
      color: #0B0E14;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
    }

    .sweet-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="auth-container">
      
      <div class="brand-hero">
        <img src="Imagens/logo sem fundo.webp" alt="Kinetix Talpa Systems Logo" class="logo-large">
        <h1>RECUPERAR SENHA</h1>
        <span class="sub-hero">Informe seu e-mail cadastrado na TransCargo Express para receber as instruções de redefinição.</span>
      </div>

      <form class="form-glass" id="forgotForm" onsubmit="return handleForgot(event);">
        
        <div class="form-group">
          <label class="form-label" for="forgotEmail">E-mail Cadastrado</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="forgotEmail" class="form-input" placeholder="operador@transcargo.com.br" required value="operador@transcargo.com.br">
          </div>
        </div>

        <button type="submit" class="btn-primary">
          ENVIAR LINK DE RECUPERAÇÃO
        </button>

      </form>

      <div class="auth-footer">
        <a href="login.html">&larr; Voltar ao Login</a>
      </div>

    </div>
  </div>

  <!-- Custom SweetAlert Modal Element -->
  <div class="sweet-backdrop" id="sweetBackdrop">
    <div class="sweet-card">
      <div class="sweet-icon-wrap success" id="sweetIcon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h3 class="sweet-title" id="sweetTitle">Sucesso!</h3>
      <p class="sweet-msg" id="sweetMsg">Mensagem enviada com sucesso.</p>
      <button class="sweet-btn" id="sweetConfirmBtn" onclick="closeSweetModal()">ENTENDIDO</button>
    </div>
  </div>

  <script>
    let currentSweetCallback = null;

    function showSweetAlert({ title, message, type = 'success', onConfirm }) {
      const backdrop = document.getElementById('sweetBackdrop');
      const titleEl = document.getElementById('sweetTitle');
      const msgEl = document.getElementById('sweetMsg');
      const iconWrap = document.getElementById('sweetIcon');
      
      titleEl.textContent = title;
      msgEl.textContent = message;
      currentSweetCallback = onConfirm;

      if (type === 'success') {
        iconWrap.className = 'sweet-icon-wrap success';
        iconWrap.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
      } else if (type === 'alert') {
        iconWrap.className = 'sweet-icon-wrap alert';
        iconWrap.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
      }

      backdrop.classList.add('active');
    }

    function closeSweetModal() {
      document.getElementById('sweetBackdrop').classList.remove('active');
      if (currentSweetCallback) {
        currentSweetCallback();
        currentSweetCallback = null;
      }
    }

    function handleForgot(event) {
      event.preventDefault();
      const email = document.getElementById('forgotEmail').value;
      
      showSweetAlert({
        title: 'Instruções Enviadas!',
        message: `Enviamos as instruções de redefinição de senha para ${email}. Verifique sua caixa de entrada.`,
        type: 'success',
        onConfirm: () => {
          window.location.href = 'login.html';
        }
      });
      return false;
    }
  </script>
</body>
</html>
