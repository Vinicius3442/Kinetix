<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetix - Perfil do Usuário | Talpa Systems</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --obsidian-pitch: #0B0E14;
      --charcoal-glass: rgba(22, 28, 38, 0.85);
      --border-slate: #263238;
      --talpa-lava: #FF5500;
      --cyber-cyan: #00E5FF;
      --electric-lime: #00E676;
      --telemetry-amber: #FFB300;
      
      --text-display: #F0F4F8;
      --text-section: #D0D8E0;
      --text-muted: #94A3B8;
      --text-log: #64748B;
      
      --dot-grid-color: #1C2432;
      
      --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--obsidian-pitch);
      background-image: radial-gradient(var(--dot-grid-color) 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      color: var(--text-display);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: var(--obsidian-pitch);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .app-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-slate);
      background: rgba(11, 14, 20, 0.95);
      backdrop-filter: blur(10px);
      z-index: 9;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Logo Icon Aumentada */
    .logo-icon {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.45));
    }

    .brand-info h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-display);
      line-height: 1.1;
      letter-spacing: 0.5px;
    }

    .brand-info span {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .card-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .badge-cyan {
      background: rgba(0, 229, 255, 0.12);
      color: var(--cyber-cyan);
      border: 1px solid rgba(0, 229, 255, 0.3);
    }

    .badge-lime {
      background: rgba(0, 230, 118, 0.12);
      color: var(--electric-lime);
      border: 1px solid rgba(0, 230, 118, 0.3);
    }

    .screen-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 80px;
    }

    .profile-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      padding: 10px 0;
    }

    .avatar-wrap {
      position: relative;
      width: 84px;
      height: 84px;
    }

    .avatar-img {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyber-cyan), var(--talpa-lava));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--obsidian-pitch);
      border: 2px solid var(--cyber-cyan);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }

    .avatar-edit-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 26px;
      height: 26px;
      background: var(--talpa-lava);
      border: 2px solid var(--obsidian-pitch);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      cursor: pointer;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-display);
    }

    .profile-role {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .card-glass {
      background: var(--charcoal-glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-slate);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-section);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      background: rgba(11, 14, 20, 0.8);
      border: 1px solid var(--border-slate);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text-display);
      font-family: var(--font-ui);
      font-size: 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }

    .btn-save {
      background: var(--talpa-lava);
      border: 1px solid var(--talpa-lava);
      color: #FFF;
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      width: 100%;
      margin-top: 6px;
      box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
    }

    .btn-save:hover {
      background: #E04B00;
    }

    .btn-logout {
      background: rgba(255, 85, 0, 0.12);
      border: 1px solid rgba(255, 85, 0, 0.4);
      color: var(--talpa-lava);
      padding: 11px;
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: rgba(255, 85, 0, 0.25);
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      height: 64px;
      background: rgba(11, 14, 20, 0.95);
      border-top: 1px solid var(--border-slate);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
      width: 25%;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
    }

    .nav-item.active {
      color: var(--cyber-cyan);
      font-weight: 700;
    }

    .nav-item.active svg {
      stroke: var(--cyber-cyan);
    }

    /* Kinetix Custom SweetAlert Style Modal */
    .sweet-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .sweet-backdrop.active {
      display: flex;
      animation: sweetPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes sweetPop {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .sweet-card {
      width: 100%;
      max-width: 340px;
      background: #111722;
      border: 1px solid var(--cyber-cyan);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
    }

    .sweet-icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 229, 255, 0.1);
      border: 2px solid var(--cyber-cyan);
      color: var(--cyber-cyan);
    }

    .sweet-icon-wrap.success {
      background: rgba(0, 230, 118, 0.1);
      border-color: var(--electric-lime);
      color: var(--electric-lime);
    }

    .sweet-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-display);
    }

    .sweet-msg {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .sweet-btn {
      background: var(--cyber-cyan);
      border: none;
      color: #0B0E14;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
    }

    .sweet-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="Imagens/logo sem fundo.webp" alt="Kinetix Logo" class="logo-icon">
        <div class="brand-info">
          <h1>KINETIX</h1>
          <span>Perfil do Operador</span>
        </div>
      </div>
      <span class="card-badge badge-lime" id="roleBadge">Operador</span>
    </header>

    <main class="screen-container">
      
      <!-- Profile Header Hero -->
      <div class="profile-hero">
        <div class="avatar-wrap">
          <div class="avatar-img" id="avatarDisplay">CS</div>
          <button class="avatar-edit-btn" onclick="document.getElementById('fileInput').click()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
          <input type="file" id="fileInput" style="display: none;" onchange="handleAvatarChange(event)">
        </div>
        <h2 class="profile-name" id="profileName">Carlos Silva</h2>
        <span class="profile-role">Matrícula: TC-8902 &bull; TransCargo Express SJC</span>
      </div>

      <!-- Form de Edição de Perfil -->
      <form class="card-glass" onsubmit="return handleProfileSave(event)">
        <div class="form-group">
          <label class="form-label" for="profName">Nome Completo</label>
          <input type="text" id="profName" class="form-input" value="Carlos Silva" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="profEmail">E-mail Corporativo</label>
          <input type="email" id="profEmail" class="form-input" value="operador@transcargo.com.br" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="profRole">Função Operacional</label>
          <input type="text" id="profRole" class="form-input" value="Operador de Logística & Telemetria" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="profUnit">Unidade / Base</label>
          <input type="text" id="profUnit" class="form-input" value="Terminal SJC Pres. Dutra" required>
        </div>

        <button type="submit" class="btn-save">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          SALVAR ALTERAÇÕES DO PERFIL
        </button>
      </form>

      <button class="btn-logout" onclick="handleLogout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        LOGOUT / ENCERRA SESSÃO
      </button>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="nav-bar">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Gêmeo 3D</span>
      </a>

      <a href="timeline.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
        <span>Auditoria</span>
      </a>

      <a href="qr_scanner.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M9 9h6v6H9z"/></svg>
        <span>QR Code</span>
      </a>

      <a href="profile.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Meu Perfil</span>
      </a>
    </nav>
  </div>

  <!-- Custom SweetAlert Modal Element -->
  <div class="sweet-backdrop" id="sweetBackdrop">
    <div class="sweet-card">
      <div class="sweet-icon-wrap success" id="sweetIcon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h3 class="sweet-title" id="sweetTitle">Sucesso!</h3>
      <p class="sweet-msg" id="sweetMsg">Mensagem enviada com sucesso.</p>
      <button class="sweet-btn" id="sweetConfirmBtn" onclick="closeSweetModal()">ENTENDIDO</button>
    </div>
  </div>

  <script>
    let currentSweetCallback = null;

    function showSweetAlert({ title, message, type = 'success', onConfirm }) {
      const backdrop = document.getElementById('sweetBackdrop');
      const titleEl = document.getElementById('sweetTitle');
      const msgEl = document.getElementById('sweetMsg');
      const iconWrap = document.getElementById('sweetIcon');
      
      titleEl.textContent = title;
      msgEl.textContent = message;
      currentSweetCallback = onConfirm;

      if (type === 'success') {
        iconWrap.className = 'sweet-icon-wrap success';
        iconWrap.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
      }

      backdrop.classList.add('active');
    }

    function closeSweetModal() {
      document.getElementById('sweetBackdrop').classList.remove('active');
      if (currentSweetCallback) {
        currentSweetCallback();
        currentSweetCallback = null;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const userRole = localStorage.getItem('userRole') || 'op';
      const roleBadge = document.getElementById('roleBadge');

      if (userRole === 'admin') {
        roleBadge.textContent = 'Gestor Admin';
        roleBadge.className = 'card-badge badge-cyan';
        document.getElementById('profileName').textContent = 'Admin TransCargo';
        document.getElementById('profName').value = 'Administrador Kinetix';
        document.getElementById('profEmail').value = 'admin@transcargo.com.br';
        document.getElementById('profRole').value = 'Gestor Geral de IIoT & Frotas';
        document.getElementById('avatarDisplay').textContent = 'AD';
      }
    });

    function handleProfileSave(e) {
      e.preventDefault();
      const name = document.getElementById('profName').value;
      document.getElementById('profileName').textContent = name;
      
      showSweetAlert({
        title: 'Perfil Atualizado!',
        message: `As informações de ${name} foram salvas e sincronizadas no sistema TransCargo Express.`,
        type: 'success'
      });
      return false;
    }

    function handleAvatarChange(e) {
      if (e.target.files && e.target.files[0]) {
        showSweetAlert({
          title: 'Foto Carregada!',
          message: 'Sua foto de perfil foi atualizada com sucesso.',
          type: 'success'
        });
      }
    }

    function handleLogout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
