<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetix - Login | Talpa Systems</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --obsidian-pitch: #0B0E14;
      --charcoal-glass: rgba(22, 28, 38, 0.85);
      --border-slate: #263238;
      --talpa-lava: #FF5500;
      --cyber-cyan: #00E5FF;
      --electric-lime: #00E676;
      --telemetry-amber: #FFB300;
      
      --text-display: #F0F4F8;
      --text-section: #D0D8E0;
      --text-muted: #94A3B8;
      --text-log: #64748B;
      
      --dot-grid-color: #1C2432;
      
      --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--obsidian-pitch);
      background-image: radial-gradient(var(--dot-grid-color) 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      color: var(--text-display);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: var(--obsidian-pitch);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .auth-container {
      flex: 1;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .brand-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    /* Logo Aumentada */
    .logo-large {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(0, 229, 255, 0.45));
    }

    .brand-hero h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-display);
      letter-spacing: 1px;
    }

    .brand-hero p {
      font-size: 12px;
      color: var(--cyber-cyan);
      font-style: italic;
    }

    .sub-hero {
      font-size: 11px;
      color: var(--text-muted);
      max-width: 300px;
      line-height: 1.4;
    }

    .form-glass {
      background: var(--charcoal-glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-slate);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(11, 14, 20, 0.6);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-slate);
    }

    .role-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 6px;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .role-btn.active {
      background: rgba(0, 229, 255, 0.15);
      color: var(--cyber-cyan);
      border: 1px solid var(--cyber-cyan);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-section);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
    }

    .form-input {
      width: 100%;
      background: rgba(11, 14, 20, 0.8);
      border: 1px solid var(--border-slate);
      border-radius: 8px;
      padding: 10px 12px 10px 36px;
      color: var(--text-display);
      font-family: var(--font-ui);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }

    .forgot-link {
      align-self: flex-end;
      font-size: 11px;
      color: var(--cyber-cyan);
      text-decoration: none;
      font-weight: 500;
    }

    .btn-primary {
      background: var(--talpa-lava);
      border: 1px solid var(--talpa-lava);
      color: #FFF;
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
      width: 100%;
    }

    .btn-primary:hover {
      background: #E04B00;
    }

    .auth-footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--cyber-cyan);
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="auth-container">
      
      <div class="brand-hero">
        <img src="Imagens/logo sem fundo.webp" alt="Kinetix Talpa Systems Logo" class="logo-large">
        <h1>KINETIX</h1>
        <p>"Sensibilidade total onde os olhos não alcançam."</p>
        <span class="sub-hero">Talpa Systems &bull; TransCargo Express Cargo Intelligence</span>
      </div>

      <form class="form-glass" id="loginForm" onsubmit="return handleLogin(event);">
        
        <div class="role-selector">
          <button type="button" class="role-btn active" id="btnRoleOp" onclick="selectRole('op')">Operador</button>
          <button type="button" class="role-btn" id="btnRoleAdmin" onclick="selectRole('admin')">Gestor Admin</button>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginEmail">E-mail / Matrícula</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="email" id="loginEmail" class="form-input" placeholder="operador@transcargo.com.br" required value="operador@transcargo.com.br">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Senha de Acesso</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="loginPassword" class="form-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required value="kinetix2026">
          </div>
        </div>

        <a href="forgot_password.html" class="forgot-link">Esqueceu a senha?</a>

        <button type="submit" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          ENTRAR NO SISTEMA
        </button>

      </form>

      <div class="auth-footer">
        Não possui conta? <a href="register.html">Cadastre-se</a>
      </div>

    </div>
  </div>

  <script>
    let currentRole = 'op';

    function selectRole(role) {
      currentRole = role;
      const btnOp = document.getElementById('btnRoleOp');
      const btnAdmin = document.getElementById('btnRoleAdmin');
      const emailInput = document.getElementById('loginEmail');

      if (role === 'admin') {
        btnAdmin.classList.add('active');
        btnOp.classList.remove('active');
        emailInput.value = 'admin@transcargo.com.br';
      } else {
        btnOp.classList.add('active');
        btnAdmin.classList.remove('active');
        emailInput.value = 'operador@transcargo.com.br';
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      localStorage.setItem('userRole', currentRole);
      window.location.href = 'onboarding.html';
      return false;
    }
  </script>
</body>
</html>
